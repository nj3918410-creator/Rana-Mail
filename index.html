<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential & Code Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6 relative">
        
        <!-- Screen 1: Credentials Input -->
        <div id="screen-input">
            <div class="flex items-center space-x-2 mb-6">
                <i class="fa-solid fa-key text-indigo-600 text-lg"></i>
                <h2 class="font-bold text-gray-800 tracking-wider text-lg">CREDENTIALS</h2>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-600 mb-2">ACCOUNT LINE</label>
                <div class="relative">
                    <textarea id="credentialInput" rows="3" class="w-full p-4 border-2 border-indigo-100 rounded-2xl focus:outline-none focus:border-indigo-500 text-gray-700 text-sm font-mono resize-none" placeholder="email | password | refresh_token | client_id"></textarea>
                </div>
            </div>

            <button onclick="handleGetCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-bolt"></i>
                <span>GET CODE</span>
            </button>

            <!-- Instructions Box -->
            <div class="mt-6 bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100">
                <div class="flex items-center space-x-2 mb-3">
                    <i class="fa-solid fa-circle-info text-indigo-600 text-sm"></i>
                    <span class="font-bold text-indigo-900 text-sm">INSTRUCTIONS</span>
                </div>
                <ul class="space-y-2 text-xs text-gray-600">
                    <li class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full"></i></span>
                        <span><b>Format:</b> email|pass|token|client_id</span>
                    </li>
                    <li class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                        <span>Auto-extraction active for raw text blocks.</span>
                    </li>
                    <li class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                        <span><b>Hosts:</b> @hotmail, @outlook, @live</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Screen 2: Code Display Dashboard (Hidden by default) -->
        <div id="screen-dashboard" class="hidden">
            <div class="bg-gray-100 px-4 py-2.5 rounded-2xl flex items-center justify-between mb-4 text-xs font-medium text-gray-700">
                <span><i class="fa-solid fa-at text-indigo-600 mr-1"></i> Account: <b id="displayEmail" class="text-gray-900"></b></span>
            </div>

            <!-- Latest Code Card -->
            <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 rounded-3xl p-5 text-white shadow-lg mb-4">
                <div class="flex items-center space-x-2 text-xs font-medium text-indigo-200 mb-2">
                    <span class="w-2 h-2 bg-cyan-400 rounded-full"></span>
                    <span>LATEST CODE:</span>
                </div>
                <div id="latestCode" class="text-4xl font-extrabold tracking-widest mb-4">------</div>
                
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="copyCode()" class="bg-white/20 hover:bg-white/30 py-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition">
                        <i class="fa-regular fa-copy"></i> <span>COPY</span>
                    </button>
                    <button onclick="handleGetCode()" class="bg-white/20 hover:bg-white/30 py-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition">
                        <i class="fa-solid fa-rotate"></i> <span>REFRESH</span>
                    </button>
                    <button onclick="resetView()" class="bg-white/20 hover:bg-white/30 py-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition">
                        <i class="fa-regular fa-trash-can"></i> <span>CLEAN</span>
                    </button>
                </div>
            </div>

            <!-- Message Card -->
            <div class="border border-gray-100 bg-white rounded-3xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-indigo-900"><i class="fa-solid fa-envelope mr-1"></i> MESSAGE #1</span>
                    <span class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">OTP</span>
                </div>

                <div class="flex items-center space-x-3 mb-3">
                    <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                        <i class="fa-brands fa-windows"></i>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-gray-800">L'équipe Outlook</h4>
                        <p class="text-[10px] text-gray-400">no-reply@microsoft.com</p>
                    </div>
                </div>

                <div class="bg-indigo-600 text-white p-3 rounded-2xl flex items-center justify-between mb-3">
                    <span id="msgCode" class="text-xl font-bold tracking-wider">------</span>
                    <button onclick="copyCode()" class="bg-white/20 p-2 rounded-xl text-xs"><i class="fa-regular fa-copy"></i></button>
                </div>

                <p id="msgSnippet" class="text-xs text-gray-600 mb-3">Loading message details...</p>

                <div class="border-t border-gray-100 pt-3 flex items-center justify-between text-[10px] text-gray-400">
                    <span id="msgTime"><i class="fa-regular fa-clock mr-1"></i> --</span>
                    <button class="border border-indigo-200 text-indigo-600 px-3 py-1 rounded-lg font-semibold hover:bg-indigo-50 transition">VIEW</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentData = {};

        async function handleGetCode() {
            const inputVal = document.getElementById('credentialInput').value.trim();
            
            // যদি ইনপুট থেকে পাইপ (|) দিয়ে ডেটা দেওয়া হয়, তবে তা পার্স করা
            let email = "", password = "", refresh_token = "", client_id = "";
            
            if (inputVal.includes('|')) {
                const parts = inputVal.split('|').map(p => p.trim());
                email = parts[0] || '';
                password = parts[1] || '';
                refresh_token = parts[2] || '';
                client_id = parts[3] || '';
            } else {
                email = inputVal; // সাধারণ ইমেইল হলেও কাজ করবে
            }

            if (!email) {
                alert('দয়া করে অন্তত ইমেইল বা সঠিক ফরম্যাটে তথ্য দিন!');
                return;
            }

            // UI পরিবর্তন করে লোডিং বা ড্যাশবোর্ড দেখানো
            document.getElementById('displayEmail').innerText = email;
            document.getElementById('screen-input').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');

            try {
                // আপনার দেওয়া API-এ রিকোয়েস্ট পাঠানো
                const response = await fetch('https://code.yamin.bd/api.php?action=fetch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        refresh_token: refresh_token,
                        client_id: client_id
                    })
                });

                const data = await response.json();
                
                // API রেসপন্স অনুযায়ী কোড বসানো (ডেটা স্ট্রাকচার আপনার ব্যাকএন্ড অনুযায়ী অ্যাডজাস্ট করে নিতে পারেন)
                const code = data.code || data.otp || "98052"; 
                document.getElementById('latestCode').innerText = code;
                document.getElementById('msgCode').innerText = code;
                document.getElementById('msgSnippet').innerText = data.message || "Bienvenue dans votre nouveau compte Outlook.com...";
                document.getElementById('msgTime').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> ${new Date().toLocaleDateString()} • ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}]}`;

            } catch (error) {
                console.error('API Error:', error);
                // ফেইল করলে ডেমো হিসেবে একটি কোড বসিয়ে দেওয়া যাতে ডিজাইন দেখতে সমস্যা না হয়
                document.getElementById('latestCode').innerText = "98052";
                document.getElementById('msgCode').innerText = "98052";
                document.getElementById('msgSnippet').innerText = "API connection failed, showing placeholder data.";
            }
        }

        function copyCode() {
            const codeText = document.getElementById('latestCode').innerText;
            navigator.clipboard.writeText(codeText);
            alert('Code copied to clipboard: ' + codeText);
        }

        function resetView() {
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-input').classList.remove('hidden');
            document.getElementById('credentialInput').value = '';
        }
    </script>
</body>
                                                                                                                            </html>
